  /stage/{token}:
    get:
      tags: [Generate]
      summary: Stage download
      description: >-
        Serves the AES-256-GCM encrypted stage-2 payload for a signed,
        single-use stage token. Requires a valid HMAC signature in the
        `s` query parameter. No authentication (token + signature
        authorize the fetch).
      operationId: stageDownload
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
        - name: s
          in: query
          required: true
          schema: { type: string }
          description: HMAC signature over the token (stage `s` query param)
      responses:
        '200':
          description: Encrypted stage-2 payload (application/octet-stream)
        '400':
          description: Invalid stage token
        '403':
          description: Invalid signature
        '404':
          description: Stage token not found / stage not ready
        '410':
          description: Stage token expired or already consumed

