      operationId: addCredential
      security:
        - SessionCookie: []
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [username]
              properties:
                domain:
                  type: string
                username:
                  type: string
                password:
                  type: string
                hash:
                  type: string
                source:
                  type: string
                type:
