      summary: Update credential
      description: Update a credential entry
      operationId: updateCredential
      security:
        - SessionCookie: []
      parameters:
        - name: cred_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
                hash:
                  type: string
                notes:
                  type: string
                tags:
                  type: string
      responses:
        '200':
          description: Credential updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

    delete:
      tags: [Credentials]
      summary: Delete credential
