                      type: string
                    expires_at:
                      type: string
                    active:
                      type: boolean
                    created_at:
                      type: string
    post:
      tags: [Settings]
      summary: Create API key
      description: Create a new API key. The plaintext key is returned once and will not be shown again.
      operationId: createApiKey
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                expires_at:
                  type: string
                  description: RFC3339 expiry timestamp
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      key:
                        type: string
                        description: Plaintext API key (shown once)
                      prefix:
                        type: string
                      created_at:
                        type: string
                      expires_at:
                        type: string
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
