components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: forgec2_session
      description: Session cookie obtained from login endpoint

  schemas:
    SuccessResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string

    TaskResponse:
      type: object
      required: [success, task_id]
      properties:
        success:
          type: boolean
          example: true
        task_id:
          type: integer

    Error:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
        code:
          type: string
        details:
          type: string

    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
        version:
          type: string
        uptime:
          type: string

    ReadyResponse:
      type: object
      properties:
        status:
          type: string
          description: ok or not ready
          example: ok
        checks:
          type: object
          additionalProperties: true
          description: Component readiness (database, listeners, …)

    ModuleInfo:
      type: object
      properties:
        name:
          type: string
          example: Invoke-Mimikatz.ps1
        size:
          type: integer
          format: int64
        updated_at:
          type: string
          format: date-time

    ModulesListResponse:
      type: object
      required: [success, modules]
      properties:
        success:
          type: boolean
        modules:
          type: array
          items:
            $ref: '#/components/schemas/ModuleInfo'
        hint:
          type: string
          description: Operator guidance (e.g. upload mimikatz script)

    ModuleUploadResponse:
      type: object
      properties:
        success: { type: boolean }
        name: { type: string }
        size: { type: integer }

    ModuleDeployRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Module filename under data/modules
        path:
          type: string
          description: Remote path on agent (default C:/Windows/Temp/<name>)

    AgentListResponse:
      type: object
      description: |
        Envelope varies by handler. Common JSON forms include
        `{ agents: [...] }` or paginated `{ Agents|agents, Total, Page }`.
      properties:
        success:
          type: boolean
        agents:
          type: array
          items:
            $ref: '#/components/schemas/Agent'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer

    DashboardStats:
      type: object
      description: Aggregate agent/task counters for the operator dashboard
      properties:
        success:
          type: boolean
        total_agents:
          type: integer
        online_agents:
          type: integer
        stale_agents:
          type: integer
        offline_agents:
          type: integer
        total_tasks:
          type: integer
        tasks_today:
          type: integer
        pending_tasks:
          type: integer
        failed_tasks:
          type: integer
        total_listeners:
          type: integer

    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        role:
          type: string
          enum: [admin, operator, viewer, guest]
        is_active:
          type: boolean
        last_login:
          type: string
          format: date-time
        last_ip:
          type: string
        last_activity:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    Agent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique agent identifier
        hostname:
          type: string
        username:
          type: string
        os:
          type: string
          example: Windows 10 Pro
        arch:
          type: string
          example: amd64
        ip:
          type: string
        public_ip:
          type: string
        country:
          type: string
        city:
          type: string
        last_seen:
          type: string
          format: date-time
        status:
          type: string
          enum: [online, stale, offline]
        notes:
          type: string
        tags:
          type: string
        listener_id:
          type: integer
        parent_id:
          type: string
          description: Parent agent ID for P2P chaining
        p2p_mode:
          type: string
          enum: [smb, tcp, ""]
        p2p_listen_addr:
          type: string
        version:
          type: string
        pid:
          type: integer
        process_name:
          type: string
        integrity:
          type: string
          enum: [Low, Medium, High, System]
        elevated:
          type: boolean
        domain:
          type: string
        current_interval:
          type: integer
          description: Sleep interval in seconds
        current_jitter:
          type: integer
          description: Jitter percentage
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Task:
      type: object
      properties:
        id:
          type: integer
        agent_id:
          type: string
          format: uuid
        type:
          type: string
          description: Task type
        command:
          type: string
          description: Primary command or path
        shell:
          type: string
          description: Shell choice or secondary data
        path:
          type: string
        status:
          type: string
          enum: [pending, running, completed, failed]
        result:
          type: string
        error:
          type: string
        progress:
          type: integer
          description: 0-100 percentage
        total_bytes:
          type: integer
          format: int64
        transferred:
          type: integer
          format: int64
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Listener:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        scheme:
          type: string
          enum: [http, https, tcp, tls, dns, icmp, ssh, h2c]
        type:
          type: string
          enum: [http, tcp, dns, icmp, ssh, h2c]
        host:
          type: string
        port:
          type: integer
        protocol:
          type: string
        notes:
          type: string
        enabled:
          type: boolean
        tags:
          type: string
          description: Comma-separated tags for categorization
        color:
          type: string
          description: Hex color code for UI display
        status:
          type: string
          enum: [running, stopped, error]
          description: Runtime status
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ListenerCreate:
      type: object
      required: [name, scheme, host, port]
      properties:
        name:
          type: string
        scheme:
          type: string
          enum: [http, https, tcp, tls, dns, icmp, ssh, h2c]
        host:
          type: string
        port:
          type: integer
        notes:
          type: string
        tags:
          type: string
          description: Comma-separated tags for categorization
        color:
          type: string
          description: Hex color code for UI display
        status:
          type: string
          enum: [running, stopped, error]
          description: Runtime status

    ListenerUpdate:
      type: object
      properties:
        name:
          type: string
        scheme:
          type: string
        host:
          type: string
        port:
          type: integer
        notes:
          type: string
        enabled:
          type: boolean
        tags:
          type: string
          description: Comma-separated tags for categorization
        color:
          type: string
          description: Hex color code for UI display
        status:
          type: string
          enum: [running, stopped, error]
          description: Runtime status

    Credential:
      type: object
      properties:
        id:
          type: integer
        agent_id:
          type: string
          format: uuid
        domain:
          type: string
        username:
          type: string
        password:
          type: string
        hash:
          type: string
        source:
          type: string
          example: mimikatz
        type:
          type: string
          enum: [cleartext, ntlm, aes, kerberos]
        notes:
          type: string
        tags:
          type: string
        expires_at:
          type: string
          format: date-time
        confirmed:
          type: boolean
        task_id:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AuditLog:
      type: object
      properties:
        id:
          type: integer
        user:
          type: string
        action:
          type: string
        resource:
          type: string
        agent_id:
          type: string
        ip:
          type: string
        success:
          type: boolean
        error:
          type: string
        details:
          type: string
        created_at:
          type: string
          format: date-time

    TokenEntry:
      type: object
      properties:
        id:
          type: integer
        agent_id:
          type: string
          format: uuid
        pid:
          type: integer
        process_name:
          type: string
        domain:
          type: string
        username:
          type: string
        logon_type:
          type: string
        integrity:
          type: string
          enum: [Low, Medium, High, System]
        token_type:
          type: string
          enum: [Primary, Impersonation]
        source:
          type: string
          enum: [steal, make_token, duplicate]
        active:
          type: boolean
        notes:
          type: string
        created_at:
          type: string
          format: date-time

    SocksSession:
      type: object
      properties:
        id:
          type: integer
        agent_id:
          type: string
          format: uuid
        listen_port:
          type: integer
        status:
          type: string
          enum: [active, stopped]
        bytes_in:
          type: integer
          format: int64
        bytes_out:
          type: integer
          format: int64
        conn_count:
          type: integer
        notes:
          type: string
        created_at:
          type: string
          format: date-time

    AutomationRule:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        enabled:
          type: boolean
        event_type:
          type: string
        conditions:
          type: string
        actions:
          type: string
        schedule:
          type: string
          description: Cron-like schedule expression for event_type=schedule rules
        agent_id:
          type: string
        task_type:
          type: string
        command:
          type: string
        params:
          type: string
        last_run:
          type: string
          format: date-time
        next_run:
          type: string
          format: date-time
        run_count:
          type: integer
        created_by:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AutomationRuleCreate:
      type: object
      required: [name, event_type]
      properties:
        name:
          type: string
        event_type:
          type: string
        conditions:
          type: string
        actions:
          type: string
        schedule:
          type: string
        agent_id:
          type: string
        task_type:
          type: string
        command:
          type: string
        params:
          type: string

    AutomationRuleUpdate:
      type: object
      properties:
        name:
          type: string
        enabled:
          type: boolean
        conditions:
          type: string
        actions:
          type: string
        schedule:
          type: string
        agent_id:
          type: string
        task_type:
          type: string
        command:
          type: string
        params:
          type: string
          type: string

    Webhook:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        url:
          type: string
        event_type:
          type: string
        method:
          type: string
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time

    WebhookCreate:
      type: object
      required: [name, url, event_type]
      properties:
        name:
          type: string
        url:
          type: string
        event_type:
          type: string
        method:
          type: string
          default: POST
        headers:
          type: string

    SystemMetric:
      type: object
      properties:
        id:
          type: integer
        cpu_load:
          type: number
        memory_used:
          type: number
        memory_total:
          type: number
        disk_used:
          type: number
        disk_total:
          type: number
        net_in:
          type: number
        net_out:
          type: number
        hostname:
          type: string
        created_at:
          type: string
          format: date-time

    Alert:
      type: object
      properties:
        id:
          type: integer
        rule_id:
          type: integer
        type:
          type: string
        severity:
          type: string
          enum: [critical, warning, info]
        title:
          type: string
        message:
          type: string
        source:
          type: string
        source_name:
          type: string
        status:
          type: string
          enum: [active, acknowledged, resolved]
        details:
          type: string
        created_at:
          type: string
          format: date-time

    AlertRule:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
        threshold:
          type: number
        enabled:
          type: boolean
        description:
          type: string
        created_at:
          type: string
          format: date-time

    AlertRuleCreate:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          type: string
        threshold:
          type: number
        description:
          type: string

    AlertRuleUpdate:
      type: object
      properties:
        name:
          type: string
        threshold:
          type: number
        enabled:
          type: boolean
        description:
          type: string

    BOFFile:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        size:
          type: integer
          format: int64
        description:
          type: string
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Plugin:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        version:
          type: string
        description:
          type: string
        author:
          type: string
        type:
          type: string
        enabled:
          type: boolean
        category:
          type: string
        homepage:
          type: string
        license:
          type: string
        tags:
          type: string
        rating_overall:
          type: number
        rating_count:
          type: integer
        update_available:
          type: boolean
        created_at:
          type: string
          format: date-time

    PluginCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        version:
          type: string
        description:
          type: string
        author:
          type: string
        type:
          type: string
        category:
          type: string

    ChatMessage:
      type: object
      properties:
        id:
          type: integer
        user:
          type: string
        message:
          type: string
        created_at:
          type: string
          format: date-time

    CommandTemplate:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: string
          enum: [recon, privesc, lateral, exfil]
        command:
          type: string
        description:
          type: string
        created_by:
          type: string
        created_at:
          type: string
          format: date-time

    CommandTemplateCreate:
      type: object
      required: [name, category, command]
      properties:
        name:
          type: string
        category:
          type: string
        command:
          type: string
        description:
          type: string

    ScanResult:
      type: object
      properties:
        id:
          type: integer
        agent_id:
          type: string
          format: uuid
        task_id:
          type: integer
        target_ip:
          type: string
        port:
          type: integer
        protocol:
          type: string
        state:
          type: string
          enum: [open, closed, filtered]
        service:
          type: string
        version:
          type: string
        banner:
          type: string
        created_at:
          type: string
          format: date-time

    AgentLock:
      type: object
      properties:
        agent_id:
          type: string
          format: uuid
        user_id:
          type: integer
        username:
          type: string
        locked_at:
          type: string
          format: date-time
        note:
          type: string

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized - not authenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Forbidden - insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
