name: asset-inventory
version: 1.0.0
type: report
description: Generate an asset inventory report listing all agents, their properties, and operational status
author: ForgeC2
category: reporting
entry: report.py
interpreter: python
timeout: 60
params:
    - name: format
      type: string
      required: false
      default: html
      description: Output format (html, markdown, json)
    - name: group_by
      type: string
      required: false
      default: os
      description: Group assets by field (os, status, domain, country)
config:
    show_offline: "true"
