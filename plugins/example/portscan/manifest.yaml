name: portscan
version: 1.0.0
type: command
description: Simple TCP port scanner plugin for ForgeC2
author: ForgeC2
category: recon
entry: scan.py
interpreter: python
timeout: 120
params:
    - name: target
      type: string
      required: true
      description: Target host or IP address
    - name: ports
      type: string
      required: false
      default: 80,443,445,3389
      description: Comma-separated list of ports to scan
    - name: timeout
      type: number
      required: false
      default: "1"
      description: Connection timeout in seconds
config:
    max_ports: 100
digest: sha256:7e1c185b3ef8234e16e0fcc3790b4b1779747425238ab8aaca3edcb95f74cc0a
signature: cf08f3f052c7c7608b3800755ab9e073068e3fb10c7b0fcbdd60e40686ee9ca3ed589deb4a67d24d1d8fee91be9417b73d6927c52fc5264ada85ed2e90d5bc0e
includes:
    - lib
