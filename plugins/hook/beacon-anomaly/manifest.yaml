name: beacon-anomaly
version: 1.0.0
type: hook
description: Detects anomalous beacon behavior — timing deviations, payload size anomalies, jitter changes
author: ""
category: monitoring
entry: detect.py
interpreter: python3
timeout: 30
params: []
events:
    - beacon.received
    - agent.connect
    - agent.disconnect
config:
    log_file: ""
    size_threshold: 5
    timing_threshold: 3
