# golangci-lint v2 configuration.
#
# CI drives this config three ways (see .github/workflows/ci.yml, lint job):
#   1. ratchet — --new-from-rev=HEAD~ fails issues on the tip commit's changed
#      lines, so new code cannot add debt;
#   2. a full-tree record per analysis target (GOOS pinned: windows + linux),
#      checked against the committed ceiling in scripts/lint-backlog.txt by
#      scripts/check-lint-debt.sh; the ceiling may only shrink;
#   3. the mechanical linters (unconvert, ineffassign, govet, misspell) are
#      zero-tolerance on the whole tree, enforced from the same records.
# Local full runs still report the entire backlog (~967 findings on the
# windows target as of 2026-10 — G702 is excluded below, see the gosec block).
# It sat at 1056 before the mechanical cleanup.
#
# History: `gosimple` used to be listed below; golangci-lint v2 merged it into
# `staticcheck`, and the stale name made every lint run fail with an unknown
# linter error instead of reporting anything.
version: "2"
run:
  timeout: 5m
linters:
  default: none
  enable:
    - errcheck
    # golangci-lint v2 merged gosimple into staticcheck; the S1 checks run there.
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - misspell
    - unconvert
  settings:
    staticcheck:
      # QF* are quickfix suggestions (mostly fmt.Fprintf rewrites in the
      # payload generators); they flood the report and bury correctness
      # findings. S1/SA stay on, which is what caught the real issues.
      checks:
        - all
        - -QF*
    gosec:
      excludes:
        - G115
        - G101
        - G107
        - G204
        - G301
        - G302
        - G304
        # G702 ("command injection via taint analysis") is nondeterministic
        # run-to-run: on the same tree, identical invocations reported 5 of the
        # 10 windows findings and sometimes none of those 5, while every other
        # linter's finding set stayed byte-stable. A count that cannot be
        # reproduced cannot be pinned; the agent's exec path is intentional.
        - G702
    errcheck:
      exclude-functions:
        - (*os.File).Close
        - io.Close
        - (*gorm.DB).Close
        - (net.Conn).Close
        - (net.Listener).Close
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
      - node_modules
      # Embedded copy of the built frontend: generated assets, not Go code.
      - internal/webdist/dist
      # protoc-gen-go-grpc output keeps the "Code generated by" header only in
      # one of the two files, so the lax generated-detection misses it.
      - pkg/c2pb
    rules:
      # Test fixtures legitimately write 0644 temp files, use math/rand for
      # deterministic data, and assemble cookies by hand.
      - path: _test\.go
        linters:
          - gosec
issues:
  # Interactive/local runs keep the default caps so the console stays
  # readable; the debt-record steps pass --max-issues-per-linter=0 and
  # --max-same-issues=0 so the ceiling counts every finding.
  max-issues-per-linter: 50
  max-same-issues: 10