# golangci-lint v2 configuration.
#
# CI drives this config three ways (see .github/workflows/ci.yml, lint job):
#   1. ratchet — --new-from-rev=HEAD~ fails issues on the tip commit's changed
#      lines, so new code cannot add debt;
#   2. a full-tree record per analysis target (GOOS pinned: windows + linux),
#      checked against the committed ceiling in scripts/lint-backlog.txt by
#      scripts/check-lint-debt.sh; the ceiling may only shrink;
#   3. the mechanical linters (unconvert, ineffassign, govet, misspell) are
#      zero-tolerance on the whole tree, enforced from the same records.
# Local full runs still report the entire backlog (~967 findings on the
# windows target as of 2026-10 — G702 is excluded below, see the gosec block).
# It sat at 1056 before the mechanical cleanup.
#
# History: `gosimple` used to be listed below; golangci-lint v2 merged it into
# `staticcheck`, and the stale name made every lint run fail with an unknown
# linter error instead of reporting anything.
version: "2"
run:
  timeout: 5m
linters:
  default: none
  enable:
    - errcheck
    # golangci-lint v2 merged gosimple into staticcheck; the S1 checks run there.
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - misspell
    - unconvert
  settings:
    staticcheck:
      # QF* are quickfix suggestions (mostly fmt.Fprintf rewrites in the
      # payload generators); they flood the report and bury correctness
      # findings. S1/SA stay on, which is what caught the real issues.
      checks:
        - all
        - -QF*
    gosec:
      excludes:
        - G115
        - G101
        - G107
        - G204
        - G301
        - G302
        - G304
        # G702 ("command injection via taint analysis") is nondeterministic
        # run-to-run: on the same tree, identical invocations reported 5 of the
        # 10 windows findings and sometimes none of those 5, while every other
        # linter's finding set stayed byte-stable. A count that cannot be
        # reproduced cannot be pinned; the agent's exec path is intentional.
        # G702 has since been joined by its 2025-26 taint siblings — see 70x
        # below.
        - G702
        # G701/G703/G704 complete the gosec taint family ("SQL/path/SSRF via
        # taint analysis", win 1+46+2 / lin 1+47+5 rows as of batch L). Their
        # sinks are this product's inputs by design: agent task handlers
        # write the paths the operator's command names (persistence, cred
        # dump, collection), CLI generators/artifacts take -out arguments,
        # and the extc2 cookie proxy fetches what the session asks it to
        # fetch — the same judgment already recorded for G107/G204/G301-
        # G304. A taint run cannot distinguish an operator-steered intrusion
        # kit from a web app; flagging intentional sinks buries real
        # findings under ~50 rows.
        - G701
        - G703
        - G704
    errcheck:
      exclude-functions:
        - (*os.File).Close
        - io.Close
        - (*gorm.DB).Close
        - (net.Conn).Close
        - (net.Listener).Close
        # Deadline setters fail only if the socket is already dead; the
        # following read/write then fails loudly anyway. Discarding the
        # deadline error is the established idiom here.
        - (net.Conn).SetDeadline
        - (net.Conn).SetReadDeadline
        - (net.Conn).SetWriteDeadline
        # syscall lazyproc .Call returns (r1, err) where err is about the
        # lazy-loading machinery; every caller already inspects r1 (and
        # GetLastError) for the actual outcome.
        - (*syscall.LazyProc).Call
        # syscall.SyscallN returns (r1, r2, errno) the same way; the errno
        # slot is a GetLastError shadow the callers inspect separately (see
        # the syscall stub files).
        - syscall.SyscallN

        # ─────────────── batch N (2026-10) typed-wrapper groups ───────────────
        # Note: entries below use FULL import paths. golangci's errcheck
        # exclude-functions matches only by the declaration's import path —
        # bare alias names such as (*websocket.Conn).WriteMessage look fine but
        # match nothing outside the standard library (verified by capture).
        # 1) Deadline wrappers: same idiom as (net.Conn).Set*Deadline above —
        #    the setter fails only when the socket is already dead, and the
        #    next read/write fails loudly anyway. Session channels built on
        #    gorilla/websocket and packet conns.
        - (*github.com/gorilla/websocket.Conn).SetReadDeadline
        - (*github.com/gorilla/websocket.Conn).SetWriteDeadline
        - (*github.com/gorilla/websocket.Conn).SetDeadline
        - (net.PacketConn).SetReadDeadline
        #
        # 2) Best-effort response/notification writers: when the peer is gone
        #    the next operation errors out anyway; UI clients refetch, DNS
        #    resolvers re-ask, and CSV/JSON framing errors surface at their
        #    stream's own Flush/HTTP layer. Push notifications never gate the
        #    request result.
        - (*github.com/gorilla/websocket.Conn).Write
        - (*github.com/gorilla/websocket.Conn).WriteMessage
        - (github.com/miekg/dns.ResponseWriter).WriteMsg
        - (github.com/gin-gonic/gin.ResponseWriter).Write
        - (github.com/gin-gonic/gin.ResponseWriter).WriteString
        - (*encoding/csv.Writer).Write
        - (*encoding/json.Encoder).Encode
        #
        # 3) Listener teardown: a Stop error during server shutdown must not
        #    hold the whole shutdown path hostage — the process is leaving;
        #    whatever leaked is moot. (Same judgment as the deadline group:
        #    the shutdown is best-effort by design.)
        - (*github.com/forgec2/forgec2/internal/server.GRPCListener).Stop
        - (*github.com/forgec2/forgec2/internal/server.DNSBeaconListener).Stop
        - (*github.com/forgec2/forgec2/internal/server.H2CBeaconListener).Stop
        - (*github.com/forgec2/forgec2/internal/server.QUICBeaconListener).Stop
        - (*github.com/forgec2/forgec2/internal/server.SSHBeaconListener).Stop
        - (*github.com/forgec2/forgec2/internal/server.Server).stopExtraListener
        - (*github.com/slack-go/slack.RTM).Disconnect
        - (*github.com/quic-go/quic-go.Conn).CloseWithError
        #
        # 4) (*gorm.DB).DB: the *sql.DB accessor for conn-pool tuning
        #    (SetMaxOpenConns & friends); the dialector has already provisioned
        #    it, and a failure here would have failed the wrapper's own Open.
        - (*gorm.io/gorm.DB).DB
        #
        # 5) Test-fixture framing: multipart bodies in upload fixtures are
        #    best-effort scaffolding for the case under test.
        - (*mime/multipart.Part).Write
        - (*mime/multipart.Writer).WriteField
        #
        # 6) Victim-side memory teardown in the agent: VirtualFree/VirtualProtect/
        #    CloseHandle failures on cleanup paths cannot change the task's
        #    outcome (the payload already ran); inspecting them would only add
        #    logging to paths that exist to be silent.
        - golang.org/x/sys/windows.VirtualFree
        - golang.org/x/sys/windows.VirtualProtect
        - golang.org/x/sys/windows.CloseHandle
        #
        # 8) (*BackupManager).PerformBackup is a self-journaling API: it
        #    records its own failures via noteBackupResult (log + stats), so
        #    the scheduled tick loop treats it as fire-and-forget on purpose.
        - (*github.com/forgec2/forgec2/internal/server.BackupManager).PerformBackup
        #
        # 7) fmt.Sscanf here is a best-effort numeric hint parse whose failure
        #    path applies a graceful fallback value at every call.
        - fmt.Sscanf
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
      - node_modules
      # Embedded copy of the built frontend: generated assets, not Go code.
      - internal/webdist/dist
      # protoc-gen-go-grpc output keeps the "Code generated by" header only in
      # one of the two files, so the lax generated-detection misses it.
      - pkg/c2pb
    rules:
      # Test fixtures legitimately write 0644 temp files, use math/rand for
      # deterministic data, and assemble cookies by hand.
      - path: _test\.go
        linters:
          - gosec
issues:
  # Interactive/local runs keep the default caps so the console stays
  # readable; the debt-record steps pass --max-issues-per-linter=0 and
  # --max-same-issues=0 so the ceiling counts every finding.
  max-issues-per-linter: 50
  max-same-issues: 10