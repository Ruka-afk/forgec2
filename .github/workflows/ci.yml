name: CI
on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: go mod download
      - run: go vet ./internal/... ./pkg/... ./cmd/...
      - run: go test ./internal/config/... ./internal/crypto/... ./internal/db/... ./internal/logger/... ./internal/malleable/... ./internal/obfuscation/... ./internal/plugin/... ./internal/report/... ./internal/server/... ./pkg/... -count=1 -timeout 5m -coverprofile=coverage.out
      - run: go build ./cmd/server
      - run: go build -o checkopenapi ./cmd/checkopenapi
      - name: OpenAPI check (core paths + min coverage)
        run: |
          ./checkopenapi -min-coverage 0.90
          # Fail if OpenAPI drifts ahead of backend (wrong docs)
          stale=$(./checkopenapi -list-stale | tail -n +2 | wc -l)
          test "$stale" -eq 0
      - name: Build server for smoke
        run: go build -o forgec2-server ./cmd/server
      - name: API smoke (unauthenticated)
        run: |
          mkdir -p data/db
          ./forgec2-server -config config.example.yaml > /tmp/forgec2-smoke.log 2>&1 &
          echo $! > /tmp/forgec2-smoke.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health | grep -q ok; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/health | grep -q ok
          code=$(curl -s -o /tmp/modules.body -w "%{http_code}" http://127.0.0.1:8000/api/modules)
          test "$code" = "401"
          grep -q unauthorized /tmp/modules.body || grep -q success /tmp/modules.body
          kill $(cat /tmp/forgec2-smoke.pid) || true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
