name: CI
on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: go mod download
      - run: go vet ./internal/... ./pkg/... ./cmd/...
      - run: go test ./internal/config/... ./internal/crypto/... ./internal/db/... ./internal/logger/... ./internal/malleable/... ./internal/obfuscation/... ./internal/plugin/... ./internal/report/... ./internal/server/... ./pkg/... -count=1 -timeout 5m -coverprofile=coverage.out
      - run: go build ./cmd/server
      - run: go build -o checkopenapi ./cmd/checkopenapi
      - name: OpenAPI check (core paths + min coverage)
        run: |
          ./checkopenapi -min-coverage 0.90
          # Fail if OpenAPI drifts ahead of backend (wrong docs)
          stale=$(./checkopenapi -list-stale | tail -n +2 | wc -l)
          test "$stale" -eq 0
      - name: Build server for smoke
        run: go build -o forgec2-server ./cmd/server
      - name: API smoke (unauth + default admin)
        run: |
          # Fresh DB. config.example.yaml leaves auth.default_password empty
          # (secure default -> random password printed on first boot), so CI
          # injects a strong password for the login test and tells the smoke
          # script what it is.
          SMOKE_ADMIN_PASSWORD="S1mokeC2-$(openssl rand -hex 8)-9z!Z"
          sed "s/^  default_password:.*/  default_password: $SMOKE_ADMIN_PASSWORD/" config.example.yaml > config.ci.yaml
          rm -rf data/db
          mkdir -p data/db
          export SMOKE_ADMIN_PASSWORD
          ./forgec2-server -config config.ci.yaml > /tmp/forgec2-smoke.log 2>&1 &
          echo $! > /tmp/forgec2-smoke.pid
          for i in $(seq 1 30); do
            if curl -skf https://127.0.0.1:8000/health | grep -q ok; then break; fi
            sleep 1
          done
          chmod +x scripts/ci-api-smoke.sh
          scripts/ci-api-smoke.sh
          kill $(cat /tmp/forgec2-smoke.pid) || true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run check:i18n
      - run: npm run check:css
      - run: npm run check:paths
      - run: npm test
      - run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright smoke (static UI)
        run: npm run test:e2e
