name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  webdist:
    name: Build frontend embed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci && npm run build
      - name: Refresh embedded webdist
        run: |
          rm -rf internal/webdist/dist
          cp -r frontend/out internal/webdist/dist
      - uses: actions/upload-artifact@v7
        with:
          name: webdist
          path: internal/webdist/dist

  goreleaser:
    name: Cross-compile and release
    runs-on: ubuntu-latest
    needs: [webdist]
    strategy:
      matrix:
        goos: [linux, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"

      - name: Download fresh webdist
        uses: actions/download-artifact@v8
        with:
          name: webdist
          path: internal/webdist/dist

      - name: Build forgec2-server (${{ matrix.goos }}/${{ matrix.goarch }})
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          go build -o "forgec2-server-${{ matrix.goos }}-${{ matrix.goarch }}${ext}" ./cmd/server
          sha256sum "forgec2-server-${{ matrix.goos }}-${{ matrix.goarch }}${ext}" > "forgec2-server-${{ matrix.goos }}-${{ matrix.goarch }}${ext}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: forgec2-server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: forgec2-server-${{ matrix.goos }}-${{ matrix.goarch }}*

  create-release:
    needs: goreleaser
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: forgec2-server-*
          merge-multiple: true

      - name: Generate release notes
        run: |
          echo "## ForgeC2 Server" > release-notes.md
          echo "" >> release-notes.md
          echo "Prebuilt binaries for \`${{ github.ref_name }}\`:" >> release-notes.md
          ls forgec2-server-* | grep -v '.sha256$' | sed 's/^/- /' >> release-notes.md

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: forgec2-server-*
          body_path: release-notes.md
          draft: false
          prerelease: false
