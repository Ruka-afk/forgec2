name: Release

# Actions are pinned to full commit SHAs (supply-chain hygiene: a moved tag
# cannot change what runs). Dependabot updates the SHA along with the trailing
# version comment — do not replace them with floating tags.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  # Required for actions/attest-build-provenance (SLSA-style build attestation).
  id-token: write
  attestations: write

jobs:
  webdist:
    name: Build frontend embed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci && npm run build
      - name: Refresh embedded webdist
        run: |
          rm -rf internal/webdist/dist
          cp -r frontend/out internal/webdist/dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webdist
          path: internal/webdist/dist

  goreleaser:
    name: Cross-compile and release
    runs-on: ubuntu-latest
    needs: [webdist]
    strategy:
      matrix:
        goos: [linux, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"

      - name: Download fresh webdist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: webdist
          path: internal/webdist/dist

      - name: Build forgec2-server (${{ matrix.goos }}/${{ matrix.goarch }})
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          bin="forgec2-server-${{ matrix.goos }}-${{ matrix.goarch }}${ext}"
          go build -ldflags "-X github.com/forgec2/forgec2/internal/server.ServerVersion=${{ github.ref_name }}" -o "$bin" ./cmd/server
          # Fail the job if the tag didn't make it into the binary.
          # (Windows/arm64 binaries can't execute on this runner — same
          # ldflags line builds them, and linux/amd64 proves the wiring.)
          if [ "${{ matrix.goos }}/${{ matrix.goarch }}" = "linux/amd64" ]; then
            if [ "$(./"$bin" -version)" != "${{ github.ref_name }}" ]; then
              echo "version mismatch: binary reports [$(./"$bin" -version)] but tag is [${{ github.ref_name }}]"
              exit 1
            fi
          fi
          sha256sum "$bin" > "$bin.sha256"
          # Detached Ed25519 signature over the checksum file (hot-update
          # trust anchor: crypto.update_signing_key). Tag releases MUST ship
          # a .sig — fail closed so keyed servers can always verify. Manual
          # workflow_dispatch without a secret still skips (dev-only).
          if [ -n "${RELEASE_SIGNING_KEY:-}" ]; then
            # Sign with the runner's own toolchain: this job exports
            # GOOS/GOARCH for the cross-compile, and a `go run` that honours
            # them produces a Windows PE that Linux cannot execute
            # ("exec format error"). GOHOSTOS/GOHOSTARCH ignore the env.
            GOOS="$(go env GOHOSTOS)" GOARCH="$(go env GOHOSTARCH)" \
              go run ./cmd/sign-release "$bin.sha256"
          elif [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            echo "RELEASE_SIGNING_KEY secret is required for tag releases" >&2
            exit 1
          else
            echo "RELEASE_SIGNING_KEY unset (non-tag run): skipping detached signature for $bin.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: forgec2-server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: forgec2-server-${{ matrix.goos }}-${{ matrix.goarch }}*

      - name: Generate SBOM (CycloneDX, Go modules)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.9.0 \
            mod -licenses -output forgec2-server-linux-amd64.sbom.json .

      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: forgec2-server-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}

  bundle:
    name: One-click bundle (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: [goreleaser]
    strategy:
      matrix:
        goos: [linux, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the platform binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: forgec2-server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: incoming

      - name: Assemble the archive
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          name="forgec2-v${version}-${{ matrix.goos }}-${{ matrix.goarch }}"
          stage="stage/$name"
          mkdir -p "$stage"

          # Exactly one binary per artifact; checksum/signature siblings are
          # filtered out so a second match cannot slip into the archive.
          src="$(find incoming -maxdepth 1 -type f \
            -name 'forgec2-server-${{ matrix.goos }}-${{ matrix.goarch }}*' \
            | grep -vE '\.sha256$|\.sig$' | head -n1)"
          test -n "$src"

          cp config.example.yaml LICENSE packaging/QUICKSTART.txt "$stage/"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            cp "$src" "$stage/forgec2-server.exe"
            # cmd.exe is happiest with CRLF while the repository keeps LF for
            # byte-stable diffs: convert at packaging time, not in git.
            sed 's/$/\r/' packaging/windows/start.cmd > "$stage/start.cmd"
            ( cd stage && zip -qr "$name.zip" "$name" )
            archive="$name.zip"
          else
            cp "$src" "$stage/forgec2-server"
            cp packaging/linux/start.sh "$stage/start.sh"
            chmod +x "$stage/forgec2-server" "$stage/start.sh"
            # Reproducible tar: sorted entries, fixed owner and mtime.
            ( cd stage && tar --owner=0 --group=0 --numeric-owner --sort=name \
                --mtime="@${SOURCE_DATE_EPOCH:-0}" \
                -czf "$name.tar.gz" "$name" )
            archive="$name.tar.gz"
          fi

          # Hash from inside stage/ so the .sha256 records the bare file name:
          # `sha256sum -c` has to work in whatever folder the user downloaded to.
          ( cd stage && sha256sum "$archive" > "$archive.sha256" )
          out="stage/$archive"
          # Same trust anchor as the raw binaries: a detached Ed25519 signature
          # over the checksum file. Tag releases fail closed without a key.
          if [ -n "${RELEASE_SIGNING_KEY:-}" ]; then
            GOOS="$(go env GOHOSTOS)" GOARCH="$(go env GOHOSTARCH)" \
              go run ./cmd/sign-release "$out.sha256"
          elif [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            echo "RELEASE_SIGNING_KEY secret is required for tag releases" >&2
            exit 1
          else
            echo "RELEASE_SIGNING_KEY unset (non-tag run): skipping signature for $out.sha256"
          fi
          ls -lh "$out"*

      - name: Upload bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: forgec2-bundle-${{ matrix.goos }}-${{ matrix.goarch }}
          path: stage/forgec2-*

  create-release:
    needs: [goreleaser, bundle]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: forgec2-*
          merge-multiple: true

      - name: Generate release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Lift the matching CHANGELOG section so release notes track the repo
          # instead of being maintained twice. The heading carries a date
          # ("## [2.7.0] - 2026-10-22"), so match the prefix, not the whole line,
          # and strip the tag's "v" to meet the changelog's bare version.
          awk -v tag="$version" '
            index($0, "## [" tag "]") == 1 {in_section=1; next}
            /^## \[/ && in_section {exit}
            in_section {print}
          ' CHANGELOG.md > changelog-section.md
          # Fail closed: an empty section would otherwise publish a release whose
          # "Changelog" heading is followed by nothing.
          test -s changelog-section.md || { echo "CHANGELOG.md has no section for $version" >&2; exit 1; }

          {
            echo "## ForgeC2 Server ${{ github.ref_name }}"
            echo ""
            echo "### One-click start (no toolchain required)"
            echo ""
            echo "The web console is embedded in the binary: no Node.js, no Go and no"
            echo "external database. Unpack the archive for your platform and start it."
            echo ""
            echo "| Platform | Start |"
            echo "| --- | --- |"
            echo "| Windows | unzip, then double-click \`start.cmd\` |"
            echo "| Linux | \`tar xzf <archive> && cd <dir> && ./start.sh\` |"
            echo ""
            for f in forgec2-v*-windows-*.zip forgec2-v*-linux-*.tar.gz; do
              [ -e "$f" ] || continue
              echo "- \`$f\` + \`.sha256\`"
            done
            echo ""
            echo "The first start creates \`config.yaml\`, prints the generated \`admin\`"
            echo "password and serves the console on \`https://127.0.0.1:8000/\`"
            echo "(self-signed certificate on first run). Every archive ships"
            echo "\`QUICKSTART.txt\`."
            echo ""
            echo "### Raw binaries"
            echo ""
            ls forgec2-server-* 2>/dev/null | grep -vE '\.sha256$|\.sig$|sbom' | sed 's/^/- /'
            echo ""
            echo "Every binary and archive ships a \`.sha256\` checksum and a detached"
            echo "Ed25519 \`.sig\` over that checksum (verify with"
            echo "\`go run ./cmd/sign-release <file.sha256>\`). A CycloneDX SBOM is"
            echo "attached as \`forgec2-server-linux-amd64.sbom.json\`."
            echo ""
            echo "### Changelog"
            echo ""
            cat changelog-section.md
          } > release-notes.md
          test -s release-notes.md

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: forgec2-*
          body_path: release-notes.md
          draft: false
          prerelease: false
