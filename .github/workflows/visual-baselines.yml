name: Visual baselines

# Regenerates the Playwright visual baselines for Linux.
#
# Baselines are committed per platform because fonts change the rendering, and
# Playwright picks `<name>-<platform>.png`:
#   win32 -> generated by a developer on Windows (`npx playwright test
#            e2e/layout.spec.ts --update-snapshots` in frontend/)
#   linux -> generated here on ubuntu-latest, i.e. the same image the frontend
#            CI job compares against
#
# Run from the Actions tab (or `gh workflow run visual-baselines.yml`), then
# download the artifact and commit the PNGs. Intentionally dispatch-only: an
# automatic run would silently bless unintended UI changes.
#
# Actions are pinned to full commit SHAs (supply-chain hygiene); dependabot
# updates the SHA along with the trailing version comment.

on:
  workflow_dispatch:

jobs:
  linux-baselines:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - name: Render linux baselines
        # CI is cleared so Playwright treats this as a writable local run; the
        # rendered PNGs are uploaded as an artifact and reviewed in a commit.
        env:
          CI: ''
        run: npx playwright test e2e/layout.spec.ts --update-snapshots --project=mobile --project=laptop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-baselines-linux
          path: frontend/e2e/layout.spec.ts-snapshots/*-linux.png
          if-no-files-found: error
          retention-days: 14
