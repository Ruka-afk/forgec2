name: Webdist export

# Renders the embedded frontend bundle on Linux and uploads it as an
# artifact.
#
# The committed internal/webdist/dist has to satisfy two comparisons: the
# local `npm run check:webdist` (committed dist vs. a fresh local build) and
# the CI frontend job (committed dist vs. a fresh Linux build). A Windows
# workstation can only satisfy the first one, because the bundle is not
# byte-identical across platforms.
#
# This workflow produces the Linux artifact. Run it, download the artifact
# and replace internal/webdist/dist with it (the same way the
# visual-baselines workflow refreshes the Linux screenshots).
#
# Dispatch-only on purpose: an automatic run would silently bless an
# unintended UI change.
on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v6.1.2
        with:
          name: webdist-linux
          path: frontend/out
          if-no-files-found: error
          retention-days: 14
