version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-deps:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      # Only group semver-compatible bumps; majors arrive as individual PRs so a
      # breaking update cannot red the whole batch (see #23: TS 7 vs openapi-typescript).
      npm-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # The `~1.6.0` pin is deliberate: 1.9.0 makes vendor-baseui and
    # vendor-baseui-forms import each other, throwing "Cannot access 'we'
    # before initialization" before the SPA mounts. 1.7/1.8 sit outside the
    # pin and are untested; revisit them with BASEUI_PAGE_ONLY_KEYS.
    ignore:
      - dependency-name: "@base-ui/react"
        versions: [">=1.7.0 <2.0.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  # Base images are digest-pinned in the Dockerfile / docker-compose.yml;
  # these two ecosystems keep the digests fresh instead of freezing them.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker-base:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    groups:
      compose-images:
        patterns: ["*"]
