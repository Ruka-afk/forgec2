version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-deps:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      # Only group semver-compatible bumps; majors arrive as individual PRs so a
      # breaking update cannot red the whole batch (see #23: TS 7 vs openapi-typescript).
      npm-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # The frontend floor is Node 24.15 (CI/release use 24). Node 25/26
      # types would advertise APIs the supported runtime does not provide;
      # revisit when the floor moves.
      - dependency-name: "@types/node"
        versions: [">=25.0.0 <27.0.0"]
      # typescript-eslint 8.72 peers <6.1.0 and openapi-typescript 7.13
      # peers ^5.x; TypeScript 7.0.2 cannot be adopted until both accept it.
      - dependency-name: "typescript"
        versions: [">=7.0.0 <8.0.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  # Base images are digest-pinned in the Dockerfile / docker-compose.yml;
  # these two ecosystems keep the digests fresh instead of freezing them.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker-base:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    groups:
      compose-images:
        patterns: ["*"]
