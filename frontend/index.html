<!doctype html>
<html lang="en" class="h-full font-sans">
  <head>
    <meta charSet="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="ForgeC2 frontend" />
    <link rel="icon" href="/favicon.ico" />
    <title>ForgeC2 - Professional Red Team C2 Framework</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("forgec2_theme");
          var dark;
          if (t === "dark") dark = true;
          else if (t === "light") dark = false;
          else if (t === "system") dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          else dark = false;
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {
          /* silent */
        }
        try {
          var l = localStorage.getItem("forgec2_lang");
          if (l === "zh") document.documentElement.lang = "zh";
        } catch (e) {
          /* silent */
        }
      })();
    </script>
  </head>
  <body class="antialiased h-full">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
